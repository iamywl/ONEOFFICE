name: Feature / Proposal Diagram Request (기능 및 제안서 도식 템플릿 제안)
description: 새로운 제안서 도식화 템플릿, 엑셀/차트 연동, PDF 서명 기능, 또는 MCP 도구를 제안합니다.
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 제안 카테고리 (Category)
      options:
        - "제안서 시맨틱 도식화 템플릿 (Proposal DiagramSpec Template)"
        - "인플레이스 엑셀 수식 표 / 26종 차트 연동"
        - "PDF 뷰어 & 전자서명/직인 기능"
        - "AI Agent MCP 도구 (oneoffice-mcp)"
        - "단축키 / 한글 IME / 라이트·다크 글래스 UX"
        - "크로스플랫폼 패키징 (macOS / Windows / Linux / VSIX)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 실무 불편함 (Why is this needed?)
      placeholder: "예: 정부지원사업 사업계획서 작성 시 추진일정 간트 차트 표를 한글에서 그리기 매우 번거롭습니다."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작 및 레퍼런스 스케치 (Proposed Solution & Visual Sketch)
      placeholder: "원하는 레이아웃 구조나 MCP 호출 예시, 참고 스케치 이미지를 자유롭게 첨부해 주세요."
    validations:
      required: true
